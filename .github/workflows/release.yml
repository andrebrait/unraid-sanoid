name: Release

# Publishes a GitHub release for each plugin version that reaches master (the .plg is served live from it).
on:
  push:
    branches: [master]
    paths:
      - sanoid.plg
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the release for the plugin version
        env:
          GH_TOKEN: ${{ github.token }}
          PLG: sanoid.plg
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*<!ENTITY version *"\([^"]*\)".*/\1/p' "$PLG")
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "invalid version: $version"; exit 1; }
          if gh release view "$version" >/dev/null 2>&1; then echo "release $version already exists"; exit 0; fi
          awk -v v="$version" '$0 ~ "^### ?" v "$" {f=1; next} f && (/^### ?[0-9]/ || /<\/CHANGES>/) {exit} f' "$PLG" > notes.md
          [[ -s notes.md ]] || { echo "no changelog entry for $version in $PLG"; exit 1; }
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md --latest
